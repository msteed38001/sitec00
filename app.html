<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Data App</title>
    
    <link rel="manifest" href="manifest.json">
	<link rel="stylesheet" href="site.css">
    
    <script src="js/sql-wasm.js"></script>

</head>
<body>

    <h1>Dynamic Data Viewer</h1>
    <div id="status">Loading database...</div>
    <table id="data-table" style="display:none;">
        <thead>
            <tr>
                <th>ID</th>
                <th>Slug</th>
                <th>Title</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>

    <script>
        async function loadDatabase() {
            try {
                const SQL = await initSqlJs({
                    locateFile: file => `js/${file}`
                });

                const response = await fetch('content.db');
                if (!response.ok) throw new Error("Could not fetch content.db");
                
                const buffer = await response.arrayBuffer();
                const db = new SQL.Database(new Uint8Array(buffer));

                document.getElementById('status').innerText = "Database loaded. Running query...";

                const res = db.exec("SELECT id, slug, title, status FROM pages LIMIT 10");
                
                if (res.length > 0) {
                    const values = res[0].values;
                    const tbody = document.getElementById('table-body');

                    values.forEach(row => {
                        const tr = document.createElement('tr');
                        row.forEach(cell => {
                            const td = document.createElement('td');
                            td.innerText = cell;
                            tr.appendChild(td);
                        });
                        tbody.appendChild(tr);
                    });

                    document.getElementById('status').innerText = "Query successful (Local WASM).";
                    document.getElementById('data-table').style.display = 'table';
                } else {
                    document.getElementById('status').innerText = "No data found.";
                }

            } catch (err) {
                document.getElementById('status').innerText = "Error: " + err.message;
                console.error(err);
            }
        }

        loadDatabase();
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker Registered'))
                .catch(err => console.log('Service Worker Failed', err));
        }
    </script>
</body>
</html>
